<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Views</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

.tabs {
  display: flex;
  background: #111;
}

.tabs button {
  padding: 14px 20px;
  cursor: pointer;
  background: #111;
  color: white;
  border: none;
  font-size: 14px;
}

.tabs button:hover {
  background: #333;
}

.tab-content {
  display: none;
  height: calc(100vh - 48px);
}

.tab-content.active {
  display: block;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
}
</style>
</head>
<body>

<div class="tabs">
  <button onclick="openTab('all')">All</button>
  <button onclick="openTab('next30')">Next 30 Days</button>
  <button onclick="openTab('large')">Large Space</button>
  <button onclick="openTab('floors')">Arena, View & Exercise Floors</button>
  <button onclick="openTab('arena')">Arena</button>
  <button onclick="openTab('view')">The View</button>
  <button onclick="openTab('theatre')">Theatre Wing</button>
  <button onclick="openTab('denied')">Denied/Canceled</button>
</div>

<div id="all" class="tab-content active">
  <iframe src="all.html"></iframe>
</div>

<div id="next30" class="tab-content">
  <iframe src="next30.html"></iframe>
</div>

<div id="large" class="tab-content">
  <iframe src="large.html"></iframe>
</div>

<div id="floors" class="tab-content">
  <iframe src="floors.html"></iframe>
</div>

<div id="arena" class="tab-content">
  <iframe src="arena.html"></iframe>
</div>

<div id="view" class="tab-content">
  <iframe src="view.html"></iframe>
</div>

<div id="theatre" class="tab-content">
  <iframe src="theatre.html"></iframe>
</div>

<div id="denied" class="tab-content">
  <iframe src="denied.html"></iframe>
</div>

<script>
function openTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(function(tab) {
    tab.classList.remove('active');
  });
  document.getElementById(tabId).classList.add('active');
}
</script>

</body>
</html>
