<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Views</title>

<style>
body { margin:0; font-family:Arial, sans-serif; }
.tabs { display:flex; background:#111; }
.tab-button {
  padding:14px 20px;
  cursor:pointer;
  background:#111;
  color:white;
  border:none;
}
.tab-button:hover { background:#333; }
.tab-content { display:none; height:calc(100vh - 48px); }
.tab-content.active { display:block; }
</style>
</head>
<body>

<div class="tabs">
  <button onclick="openTab('all','c6ace88f-673d-f011-a5f1-000d3a0db0e1')">All</button>
  <button onclick="openTab('next30','a3bc5715-cf52-f011-8f7c-000d3a0db9a7')">Next 30 Days</button>
  <button onclick="openTab('large','e5b3f283-4488-f011-b484-002248538047')">Large Space</button>
  <button onclick="openTab('floors','d12caaae-6541-f011-8f7d-000d3a0db550')">Arena, View & Exercise Floors</button>
  <button onclick="openTab('arena','e04a90e9-45be-f011-8193-000d3a7c34a9')">Arena</button>
  <button onclick="openTab('view','d28a5b99-45be-f011-8193-000d3a7c34a9')">The View</button>
  <button onclick="openTab('theatre','5e99f243-6641-f011-8f7d-000d3a0db550')">Theatre Wing</button>
  <button onclick="openTab('denied','049580a0-8641-f011-8f7d-000d3a0db550')">Denied/Canceled</button>
</div>

<div id="all" class="tab-content active"></div>
<div id="next30" class="tab-content"></div>
<div id="large" class="tab-content"></div>
<div id="floors" class="tab-content"></div>
<div id="arena" class="tab-content"></div>
<div id="view" class="tab-content"></div>
<div id="theatre" class="tab-content"></div>
<div id="denied" class="tab-content"></div>

<script>
var origin = "https://forneyisd.incidentiq.com";
var loadedTabs = {};

(function(doc, tag, id){
  if (doc.getElementById(id)) return;
  var js = doc.createElement(tag);
  js.id = id;
  js.src = origin + "/core/shared/public-calendar.js";
  js.type = "text/javascript";
  doc.body.appendChild(js);
}(document, 'script', 'public-calendar-script'));

function openTab(tabId, viewId) {

  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  var container = document.getElementById(tabId);
  container.classList.add('active');

  if (!loadedTabs[tabId]) {
    container.innerHTML = '<div id="'+tabId+'-calendar"></div>';

    PublicCalendar.setOptions({
      origin: origin,
      targetId: tabId + "-calendar",
      upcoming: true,
      viewId: viewId
    });

    PublicCalendar.render();

    loadedTabs[tabId] = true;
  }
}

// Auto-load first tab
window.addEventListener("load", function() {
  openTab('all','c6ace88f-673d-f011-a5f1-000d3a0db0e1');
});
</script>

</body>
</html>
